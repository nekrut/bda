project:
  type: website
  render:
    - "*.qmd"
    - "*.ipynb"
    - "*.md"
    - "!sandbox/"

website:
  title: "BMMB554"
  repo-url: https://github.com/nekrut/bda
  repo-actions: [edit]
  navbar:
    left:
      - href: index.qmd
        text: Home
    right:
      - icon: github
        href: https://github.com/nekrut/bda
        text: "Edit on GitHub"
  sidebar:
    contents:
      - section: "Lectures"
        contents:
          - href: lectures/lecture1.qmd
            text: "1. Getting Started with GitHub"
          - href: lectures/lecture2.qmd
            text: "2. Introduction to Bash"
          - href: lectures/lecture3.ipynb
            text: "3. Py1: Data analysis ecosystem - Crunch, load, visualize"
          - href: lectures/lecture4.ipynb
            text: "4. Py2: Simple sequence manipulation"
          - href: lectures/lecture5.ipynb
            text: "5. Py3: Parsing FASTA"
          - href: lectures/lecture6.ipynb
            text: "6. Py4: FASTQ and Quality Scores"
          - href: lectures/lecture7.ipynb
            text: "7. Py5: Data Manipulation with Pandas"
          - href: lectures/lecture8.ipynb
            text: "8. Py6: Building graphs with Altair"
          - href: lectures/lecture9.qmd
            text: "9. Git and GitHub"
          - href: lectures/lecture10.qmd
            text: "10. Publishing Your CV with GitHub Pages"
          # - href: lectures/lecture11.ipynb
          #   text: "11. Data Manipulation with Pandas (old)"

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
    include-after-body: _commit-info.html



