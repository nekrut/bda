            text: "4. Py2: Simple sequence manipulation"
          - href: lectures/lecture5.ipynb
            text: "5. Py3: Parsing FASTA"
          - href: lectures/lecture6.ipynb
            text: "6. Py4: FASTQ and Quality Scores"
          - href: lectures/lecture7.ipynb
