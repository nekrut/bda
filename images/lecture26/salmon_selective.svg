<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="410" y="22" text-anchor="middle" font-size="14" font-weight="bold">salmon: selective alignment + bias-aware EM</text>

  <!-- Step 1: MEMs -->
  <text x="15" y="60" font-weight="bold">1.</text>
  <text x="40" y="60">Find MEMs (Maximal Exact Matches) between the read and the transcriptome index.</text>

  <rect x="60"  y="76" width="400" height="16" fill="#f4a261" stroke="#995f1e"/>
  <text x="260" y="88" text-anchor="middle" font-size="10">read</text>
  <rect x="80"  y="100" width="80"  height="12" fill="#2b7bba"/>
  <rect x="170" y="100" width="50"  height="12" fill="#2b7bba"/>
  <rect x="230" y="100" width="120" height="12" fill="#2b7bba"/>
  <text x="80" y="126" font-size="10" fill="#555">MEM-1</text>
  <text x="170" y="126" font-size="10" fill="#555">MEM-2</text>
  <text x="230" y="126" font-size="10" fill="#555">MEM-3</text>
  <text x="460" y="108" font-size="10" fill="#143e5c" font-style="italic">(all three MEMs project onto candidate transcript T1)</text>

  <!-- Step 2: chaining -->
  <text x="15" y="158" font-weight="bold">2.</text>
  <text x="40" y="158">Chain MEMs within each compatible transcript → candidate set. Score each chain with a lightweight banded alignment.</text>
  <rect x="60" y="174" width="700" height="50" fill="#fdf4e3" stroke="#c69b51"/>
  <text x="75" y="192" font-size="11">Candidate transcripts: T1 (score 98), T4 (score 95), T7 (score 32)</text>
  <text x="75" y="208" font-size="11">Reject T7: score below threshold (rules out spurious k-mer hits — the "selective" in selective alignment).</text>
  <text x="75" y="222" font-size="11">→ Rich equivalence class = {T1, T4} with scores attached.</text>

  <!-- Step 3: EM + biases -->
  <text x="15" y="254" font-weight="bold">3.</text>
  <text x="40" y="254">Online EM distributes the read across {T1, T4} weighted by score and corrected by bias models:</text>

  <g>
    <rect x="60"  y="270" width="220" height="110" fill="#e8f1f9" stroke="#2b7bba"/>
    <text x="170" y="288" text-anchor="middle" font-weight="bold" fill="#143e5c">Fragment-GC bias</text>
    <text x="75" y="308" font-size="11">Learn mapping</text>
    <text x="75" y="322" font-size="11">fragment GC% → observed rate</text>
    <text x="75" y="340" font-size="11">per-bin. Then up-weight</text>
    <text x="75" y="354" font-size="11">under-represented GC bins.</text>
    <text x="75" y="372" font-size="11">(Globins, mitochondrial RNA)</text>

    <rect x="300" y="270" width="220" height="110" fill="#eaf4e6" stroke="#6aa55c"/>
    <text x="410" y="288" text-anchor="middle" font-weight="bold" fill="#365a2e">Positional bias</text>
    <text x="315" y="308" font-size="11">Coverage along a</text>
    <text x="315" y="322" font-size="11">transcript is rarely uniform</text>
    <text x="315" y="340" font-size="11">— often 3'-biased in poly-A</text>
    <text x="315" y="354" font-size="11">libraries. Model it per</text>
    <text x="315" y="372" font-size="11">fragment position.</text>

    <rect x="540" y="270" width="220" height="110" fill="#fbeadf" stroke="#c97b35"/>
    <text x="650" y="288" text-anchor="middle" font-weight="bold" fill="#7e4516">Hexamer-priming bias</text>
    <text x="555" y="308" font-size="11">Random hexamers</text>
    <text x="555" y="322" font-size="11">prefer certain 5'-sequences.</text>
    <text x="555" y="340" font-size="11">Learn a VLMM over the first</text>
    <text x="555" y="354" font-size="11">~6 bp of each fragment and</text>
    <text x="555" y="372" font-size="11">weight counts accordingly.</text>
  </g>

  <text x="60" y="405" font-size="11" fill="#555">Output: estimated counts + TPM per transcript, plus bootstrap replicates for uncertainty.</text>
</svg>
