<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="410" y="22" text-anchor="middle" font-size="14" font-weight="bold">STAR: Maximal Mappable Prefix (MMP) search and anchor stitching</text>

  <!-- Step 1 -->
  <text x="15" y="58" font-weight="bold">Step 1</text>
  <text x="15" y="74" font-size="11">Walk read</text>
  <text x="15" y="88" font-size="11">in SA</text>

  <rect x="90" y="48" width="640" height="20" fill="#f4a261" stroke="#995f1e"/>
  <text x="410" y="62" text-anchor="middle" font-family="Menlo, monospace" font-size="11">ACGTTTG...CCAGATC | TGAGGAC...AATGCCAG (read, 100 nt)</text>

  <path d="M90,78 L440,78" stroke="#2b7bba" stroke-width="3" marker-end="url(#a1)"/>
  <defs>
    <marker id="a1" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,-5L10,0L0,5" fill="#2b7bba"/>
    </marker>
  </defs>
  <text x="265" y="95" text-anchor="middle" fill="#2b7bba" font-size="11">MMP1: longest prefix that maps uniquely to Exon 2 (ends at junction)</text>

  <!-- Step 2 -->
  <text x="15" y="140" font-weight="bold">Step 2</text>
  <text x="15" y="156" font-size="11">MMP stops</text>
  <text x="15" y="170" font-size="11">at junction</text>

  <rect x="90"  y="130" width="350" height="20" fill="#2b7bba" stroke="#143e5c"/>
  <text x="265" y="144" text-anchor="middle" fill="#fff" font-weight="bold">Anchor 1  →  Exon 2</text>

  <text x="460" y="144" fill="#c33" font-weight="bold">?</text>
  <text x="475" y="144" font-style="italic" fill="#555">next base cannot extend the current genomic match</text>

  <!-- Step 3 -->
  <text x="15" y="212" font-weight="bold">Step 3</text>
  <text x="15" y="228" font-size="11">Restart MMP</text>
  <text x="15" y="242" font-size="11">at position k+1</text>

  <rect x="440" y="200" width="290" height="20" fill="#6aa55c" stroke="#365a2e"/>
  <text x="585" y="214" text-anchor="middle" fill="#fff" font-weight="bold">Anchor 2  →  Exon 3</text>

  <!-- Step 4: stitching -->
  <text x="15" y="284" font-weight="bold">Step 4</text>
  <text x="15" y="300" font-size="11">Stitch anchors</text>
  <text x="15" y="314" font-size="11">via splice site</text>

  <rect x="90"  y="274" width="350" height="20" fill="#2b7bba" stroke="#143e5c"/>
  <rect x="440" y="274" width="290" height="20" fill="#6aa55c" stroke="#365a2e"/>
  <path d="M440,284 Q500,250 560,284" fill="none" stroke="#c33" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="500" y="248" text-anchor="middle" fill="#c33" font-size="11" font-style="italic">scan for GT..AG boundary → intron</text>

  <!-- Two-pass -->
  <rect x="60" y="328" width="720" height="42" fill="#fdf4e3" stroke="#c69b51"/>
  <text x="75" y="345" font-size="11" font-weight="bold">Two-pass:</text>
  <text x="75" y="360" font-size="11">pass 1 discovers junctions from the data; pass 2 re-aligns using those junctions as a *known* anchor database, boosting sensitivity at low-expressed isoforms.</text>
</svg>
