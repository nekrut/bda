<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="410" y="22" text-anchor="middle" font-size="14" font-weight="bold">kallisto: pseudoalignment through a transcriptome de Bruijn graph</text>

  <!-- Three transcripts -->
  <text x="15" y="58" font-weight="bold">Step 1</text>
  <text x="15" y="74" font-size="11">Build T-DBG</text>
  <text x="15" y="88" font-size="11">from transcripts</text>

  <!-- T1 -->
  <rect x="100" y="50"  width="60" height="20" fill="#2b7bba"/>
  <rect x="160" y="50"  width="60" height="20" fill="#2b7bba"/>
  <rect x="220" y="50"  width="60" height="20" fill="#2b7bba"/>
  <rect x="280" y="50"  width="60" height="20" fill="#6aa55c"/>
  <rect x="340" y="50"  width="60" height="20" fill="#6aa55c"/>
  <text x="250" y="64" text-anchor="middle" fill="#fff" font-weight="bold">Transcript A (gene G)</text>

  <rect x="100" y="80"  width="60" height="20" fill="#2b7bba"/>
  <rect x="160" y="80"  width="60" height="20" fill="#2b7bba"/>
  <rect x="220" y="80"  width="60" height="20" fill="#2b7bba"/>
  <rect x="280" y="80"  width="60" height="20" fill="#f4a261"/>
  <rect x="340" y="80"  width="60" height="20" fill="#f4a261"/>
  <text x="250" y="94" text-anchor="middle" fill="#fff" font-weight="bold">Transcript B (gene G)</text>

  <rect x="400" y="110" width="60" height="20" fill="#c77dff"/>
  <rect x="460" y="110" width="60" height="20" fill="#c77dff"/>
  <rect x="520" y="110" width="60" height="20" fill="#c77dff"/>
  <text x="490" y="124" text-anchor="middle" fill="#fff" font-weight="bold">Transcript C (gene H)</text>

  <!-- T-DBG -->
  <text x="15" y="180" font-weight="bold">Step 2</text>
  <text x="15" y="196" font-size="11">Each node is a</text>
  <text x="15" y="210" font-size="11">k-mer; colors =</text>
  <text x="15" y="224" font-size="11">transcript set</text>

  <g transform="translate(0,160)">
    <circle cx="140" cy="40" r="16" fill="#2b7bba"/>
    <circle cx="195" cy="40" r="16" fill="#2b7bba"/>
    <circle cx="250" cy="40" r="16" fill="#2b7bba"/>
    <circle cx="310" cy="10" r="16" fill="#6aa55c"/>
    <circle cx="370" cy="10" r="16" fill="#6aa55c"/>
    <circle cx="310" cy="70" r="16" fill="#f4a261"/>
    <circle cx="370" cy="70" r="16" fill="#f4a261"/>
    <circle cx="480" cy="40" r="16" fill="#c77dff"/>
    <circle cx="535" cy="40" r="16" fill="#c77dff"/>
    <circle cx="590" cy="40" r="16" fill="#c77dff"/>

    <line x1="156" y1="40" x2="179" y2="40" stroke="#444"/>
    <line x1="211" y1="40" x2="234" y2="40" stroke="#444"/>
    <line x1="266" y1="40" x2="296" y2="16" stroke="#444"/>
    <line x1="266" y1="40" x2="296" y2="64" stroke="#444"/>
    <line x1="326" y1="10" x2="354" y2="10" stroke="#444"/>
    <line x1="326" y1="70" x2="354" y2="70" stroke="#444"/>
    <line x1="496" y1="40" x2="519" y2="40" stroke="#444"/>
    <line x1="551" y1="40" x2="574" y2="40" stroke="#444"/>
  </g>

  <text x="140" y="170" text-anchor="middle" font-size="10" fill="#555">{A,B}</text>
  <text x="195" y="170" text-anchor="middle" font-size="10" fill="#555">{A,B}</text>
  <text x="250" y="170" text-anchor="middle" font-size="10" fill="#555">{A,B}</text>
  <text x="310" y="204" text-anchor="middle" font-size="10" fill="#555">{A}</text>
  <text x="310" y="260" text-anchor="middle" font-size="10" fill="#555">{B}</text>
  <text x="480" y="170" text-anchor="middle" font-size="10" fill="#555">{C}</text>

  <!-- Read -->
  <text x="15" y="310" font-weight="bold">Step 3</text>
  <text x="15" y="326" font-size="11">Look up k-mers</text>
  <text x="15" y="340" font-size="11">from one read</text>

  <rect x="100" y="300" width="400" height="18" fill="#f4a261" stroke="#995f1e"/>
  <text x="300" y="314" text-anchor="middle" font-family="Menlo, monospace" font-size="11">k1 → {A,B}   k2 → {A,B}   k3 → {B}   k4 → {B}</text>

  <!-- Equivalence class -->
  <text x="15" y="368" font-weight="bold">Step 4</text>
  <text x="15" y="384" font-size="11">Intersect sets</text>
  <text x="15" y="398" font-size="11">→ equiv. class</text>

  <rect x="100" y="356" width="640" height="34" fill="#fdf4e3" stroke="#c69b51"/>
  <text x="420" y="378" text-anchor="middle" font-family="Menlo, monospace" font-size="12">{A,B} ∩ {A,B} ∩ {B} ∩ {B}  =  {B}   → read counted toward Transcript B only</text>

  <text x="100" y="418" font-size="11" fill="#555">For reads whose equivalence class has multiple transcripts, kallisto runs EM to distribute the count probabilistically.</text>
</svg>
