<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <text x="410" y="22" text-anchor="middle" font-size="14" font-weight="bold">HISAT2: hierarchical FM-index (one global + ~48,000 local indexes)</text>

  <!-- Global index -->
  <rect x="60" y="50" width="700" height="42" fill="#2b7bba" stroke="#143e5c"/>
  <text x="410" y="76" text-anchor="middle" fill="#fff" font-weight="bold">Global FM-index over the whole genome (3 Gb)</text>

  <text x="60" y="112" font-size="11" fill="#555">Used for the initial seed lookup. A read's first seed is located in the genome via this global index.</text>

  <!-- Local indexes -->
  <text x="60" y="152" font-size="11">~55,000 local FM-indexes, each covering ~57 kb, with read-length-scale overlaps:</text>
  <g>
    <rect x="60"  y="164" width="80" height="28" fill="#6aa55c" stroke="#365a2e"/>
    <rect x="148" y="164" width="80" height="28" fill="#6aa55c" stroke="#365a2e"/>
    <rect x="236" y="164" width="80" height="28" fill="#6aa55c" stroke="#365a2e"/>
    <rect x="324" y="164" width="80" height="28" fill="#6aa55c" stroke="#365a2e"/>
    <rect x="412" y="164" width="80" height="28" fill="#6aa55c" stroke="#365a2e"/>
    <rect x="500" y="164" width="80" height="28" fill="#6aa55c" stroke="#365a2e"/>
    <rect x="588" y="164" width="80" height="28" fill="#6aa55c" stroke="#365a2e"/>
    <rect x="676" y="164" width="80" height="28" fill="#6aa55c" stroke="#365a2e"/>

    <text x="100" y="182" text-anchor="middle" fill="#fff" font-size="10">local[0]</text>
    <text x="188" y="182" text-anchor="middle" fill="#fff" font-size="10">local[1]</text>
    <text x="276" y="182" text-anchor="middle" fill="#fff" font-size="10">local[2]</text>
    <text x="364" y="182" text-anchor="middle" fill="#fff" font-size="10">...</text>
    <text x="452" y="182" text-anchor="middle" fill="#fff" font-size="10">...</text>
    <text x="540" y="182" text-anchor="middle" fill="#fff" font-size="10">...</text>
    <text x="628" y="182" text-anchor="middle" fill="#fff" font-size="10">...</text>
    <text x="716" y="182" text-anchor="middle" fill="#fff" font-size="10">local[n]</text>
  </g>

  <!-- Read anchored to local index -->
  <rect x="280" y="220" width="140" height="16" fill="#f4a261" stroke="#995f1e"/>
  <text x="350" y="232" text-anchor="middle" font-size="10">seed in local[2]</text>
  <path d="M350,220 L276,192" stroke="#444" stroke-width="1" marker-end="url(#a2)"/>
  <defs>
    <marker id="a2" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,-5L10,0L0,5" fill="#444"/>
    </marker>
  </defs>

  <!-- Why it's smaller -->
  <rect x="60" y="260" width="700" height="80" fill="#fdf4e3" stroke="#c69b51"/>
  <text x="75" y="278" font-size="11" font-weight="bold">Why it matters</text>
  <text x="75" y="294" font-size="11">• After finding a seed in the global index, extension stays inside one local index → small working set → lower RAM (~6 GB vs. ~28–30 GB for STAR).</text>
  <text x="75" y="310" font-size="11">• The extension can jump across a splice junction *within* the local index without going back to the global index.</text>
  <text x="75" y="326" font-size="11">• The graph-FM variant extends the index to encode known SNPs and haplotypes, reducing reference bias at polymorphic sites.</text>
</svg>
