<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,-5L10,0L0,5" fill="#444"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="22" text-anchor="middle" font-size="14" font-weight="bold">Splice-aware alignment: a read from mature mRNA must be mapped to the genome</text>

  <!-- Genome track -->
  <text x="15" y="70" font-weight="bold">Genome</text>
  <rect x="80"  y="55" width="160" height="22" fill="#2b7bba" stroke="#143e5c"/>
  <rect x="240" y="61" width="120" height="10" fill="#ccc" stroke="#888"/>
  <rect x="360" y="55" width="120" height="22" fill="#2b7bba" stroke="#143e5c"/>
  <rect x="480" y="61" width="150" height="10" fill="#ccc" stroke="#888"/>
  <rect x="630" y="55" width="160" height="22" fill="#2b7bba" stroke="#143e5c"/>

  <text x="160" y="70" text-anchor="middle" fill="#fff" font-weight="bold">Exon 1</text>
  <text x="300" y="68" text-anchor="middle" fill="#555" font-style="italic">intron</text>
  <text x="420" y="70" text-anchor="middle" fill="#fff" font-weight="bold">Exon 2</text>
  <text x="555" y="68" text-anchor="middle" fill="#555" font-style="italic">intron</text>
  <text x="710" y="70" text-anchor="middle" fill="#fff" font-weight="bold">Exon 3</text>

  <!-- Splice arrows showing transcript -->
  <path d="M240,66 Q300,30 360,66" fill="none" stroke="#c33" stroke-width="2"/>
  <path d="M480,66 Q555,30 630,66" fill="none" stroke="#c33" stroke-width="2"/>
  <text x="300" y="26" text-anchor="middle" fill="#c33" font-style="italic">splice</text>
  <text x="555" y="26" text-anchor="middle" fill="#c33" font-style="italic">splice</text>

  <!-- mRNA track -->
  <text x="15" y="135" font-weight="bold">mRNA</text>
  <rect x="80"  y="120" width="160" height="22" fill="#2b7bba" stroke="#143e5c"/>
  <rect x="240" y="120" width="120" height="22" fill="#2b7bba" stroke="#143e5c"/>
  <rect x="360" y="120" width="160" height="22" fill="#2b7bba" stroke="#143e5c"/>
  <text x="160" y="135" text-anchor="middle" fill="#fff" font-weight="bold">Exon 1</text>
  <text x="300" y="135" text-anchor="middle" fill="#fff" font-weight="bold">Exon 2</text>
  <text x="440" y="135" text-anchor="middle" fill="#fff" font-weight="bold">Exon 3</text>

  <!-- Read that spans Exon2/3 junction -->
  <text x="15" y="182" font-weight="bold">Read</text>
  <rect x="290" y="168" width="150" height="16" fill="#f4a261" stroke="#995f1e"/>
  <text x="365" y="180" text-anchor="middle">100-nt paired-end read from mRNA</text>

  <!-- Mapping onto the genome: show both anchors with N gap -->
  <text x="15" y="245" font-weight="bold">Alignment</text>
  <text x="15" y="260" font-size="10">to genome</text>
  <rect x="290" y="230" width="70" height="16" fill="#f4a261" stroke="#995f1e"/>
  <rect x="480" y="230" width="80" height="16" fill="#f4a261" stroke="#995f1e"/>
  <line x1="360" y1="238" x2="480" y2="238" stroke="#c33" stroke-dasharray="4,3" stroke-width="1.5"/>
  <text x="420" y="224" text-anchor="middle" fill="#c33" font-size="11" font-style="italic">N (intron, ~150 bp)</text>

  <!-- CIGAR -->
  <text x="15" y="300" font-weight="bold">CIGAR</text>
  <rect x="80" y="285" width="660" height="26" fill="#fff" stroke="#888"/>
  <text x="410" y="302" text-anchor="middle" font-family="Menlo, monospace" font-size="13">70M 150N 80M</text>

  <text x="80" y="335" font-size="11" fill="#555">→ 70 bases match on Exon 2, skip 150 bp of intron, 80 bases match on Exon 3.</text>
  <text x="80" y="350" font-size="11" fill="#555">The aligner must *discover* the junction; only then is the CIGAR well-defined.</text>
</svg>
