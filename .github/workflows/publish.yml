on:
  push:
    branches: main
  workflow_dispatch:

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install jupyter jupyterlite-core jupyterlite-pyodide-kernel pandas numpy altair seaborn matplotlib nbconvert

      - name: Render Quarto Project
        run: quarto render

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress '_site/**/*.html'
          fail: false

      - name: Create clean notebooks for JupyterLite
        run: |
          mkdir -p lite_content
          for f in lectures/lecture*.ipynb; do
            jupyter nbconvert --clear-output --to notebook --output "../lite_content/$(basename $f)" "$f"
          done
          cp lectures/*.fq lectures/*.fa lectures/*.csv lectures/*.gz lectures/*.sam lectures/*.txt lectures/*.png lite_content/ 2>/dev/null || true

      - name: Push clean notebooks to colab branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          mkdir -p colab_lectures
          cp lite_content/*.ipynb colab_lectures/
          git checkout --orphan colab-temp
          git reset
          mkdir -p lectures
          mv colab_lectures/* lectures/
          git add lectures/*.ipynb
          git commit -m "Update clean notebooks for Colab"
          git push origin colab-temp:colab --force
          git checkout main

      - name: Build JupyterLite
        run: jupyter lite build --contents lite_content --output-dir _site/lite

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
